# @/docker-compose.yml (本番用)
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile # ★本番用のDockerfileを使う
      args:
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
    container_name: brightofhouse-web # 本番用コンテナ名
    # command: npm run dev # ★この行は完全に削除
    restart: always # 本番は自動再起動
    ports:
      - "3000:3000"
    # volumes: # ★本番ではvolumesは不要 (コンテナ内にビルド済み)
    #   - .:/app
    #   - /app/node_modules
    #   - /app/.next
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      # - WATCHPACK_POLLING=true # ★本番では不要
    networks:
      - app-network

  tunnel:
    image: cloudflare/cloudflared
    container_name: brightofhouse-tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - app-network
    depends_on:
      - web

networks:
  app-network:
    driver: bridge