# @/docker-compose.dev.yml
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: brightofhouse-web-dev
    # ▼ コンテナの中で確実に環境を整えてから起動する絶対安全な命令
    command: sh -c "npm install && npx prisma generate && npm run dev"
    restart: "no"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
    networks:
      - app-network

networks:
  app-network:
    driver: bridge